syntax = "proto3";

package dssd.trainer.v1;

// Every worker serves Trainer. Sync is only answered by the current Raft
// leader: workers submit their pseudo-gradient and block until the round
// closes, then all receive the new global model together. Status lets
// the experiment script read each worker's progress.
service Trainer {
  rpc Sync(SyncRequest) returns (SyncResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message Tensor {
  string key = 1;
  repeated int64 shape = 2;
  repeated float data = 3;
}

message SyncRequest {
  string worker_id = 1;
  repeated Tensor pseudo_gradient = 2;
  // The Raft term the worker thinks is current. The leader rejects other
  // terms, so a worker can't feed a since-replaced leader.
  uint64 term = 3;
}

message SyncResponse {
  uint64 round = 1;
  repeated Tensor global_state = 2;
}

message StatusRequest {}

message StatusResponse {
  uint64 round = 1;
  optional float loss = 2;  // unset until the first inner loop finishes
}
