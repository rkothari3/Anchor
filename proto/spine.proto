syntax = "proto3";

package dssd.spine.v1;

// Membership: read-only view of the cluster as this node's SWIM sees it.
service Membership {
  rpc GetMembers(GetMembersRequest) returns (GetMembersResponse);
}

enum MemberState {
  ALIVE = 0;
  SUSPECT = 1;
  DEAD = 2;
}

message Member {
  string id = 1;
  string addr = 2;
  MemberState state = 3;
  uint64 incarnation = 4;
}

message GetMembersRequest {}

message GetMembersResponse {
  repeated Member members = 1;
}

// Raft: the two RPCs from the Raft paper (Figure 2). One node can host
// several independent Raft groups (one per shard); `group` says which.
// The DiLoCo workers use a single group named "".
service Raft {
  rpc RequestVote(RequestVoteArgs) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes command = 3;  // empty = the no-op a new leader appends
}

message RequestVoteArgs {
  string group = 1;
  uint64 term = 2;
  string candidate_id = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
}

message RequestVoteReply {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesArgs {
  string group = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated LogEntry entries = 6;  // empty = heartbeat
  uint64 leader_commit = 7;
}

message AppendEntriesReply {
  uint64 term = 1;
  bool success = 2;
}
