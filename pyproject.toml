[project]
name = "dssd"
version = "0.1.0"
description = "Fault-tolerant membership: SWIM failure detection + Raft leader election"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.84",  # must be >= the grpcio-tools that generated src/dssd/*pb
    "protobuf>=7.35,<8",  # generated code pins the protobuf major
    "torch>=2.0",
    "numpy>=1.26",
]

[project.scripts]
dssd-member = "dssd.cmd.member:main"
dssd-worker = "dssd.diloco.worker:main"
dssd-region = "dssd.sharding.cli:main"
dssd-experiment = "dssd.diloco.experiment:main"

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.84",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-protobuf",
    "types-grpcio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]

[tool.mypy]
exclude = ["_pb2(_grpc)?\\.py$", "_pb2\\.pyi$"]
